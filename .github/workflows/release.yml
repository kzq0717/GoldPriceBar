name: Build and Package

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create source archive
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="main-$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          mkdir -p dist
          git archive --format=zip --prefix="GoldPriceBarLite-${VERSION}/" \
            -o "dist/GoldPriceBarLite-${VERSION}-src.zip" HEAD
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: source-zip
          path: dist/*.zip
          if-no-files-found: error

  windows-build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Qt 6.5.3 via aqtinstall
        shell: pwsh
        run: |
          python -m pip install --upgrade pip aqtinstall
          $prefix = Join-Path $env:GITHUB_WORKSPACE "Qt"
          aqt install-qt windows desktop 6.5.3 win64_msvc2019_64 -m qtcharts -O $prefix

          $qtRoot = Join-Path $prefix "6.5.3\msvc2019_64"
          if (-not (Test-Path (Join-Path $qtRoot "bin\qmake.exe"))) {
            $qmake = Get-ChildItem -Path $prefix -Recurse -Filter qmake.exe |
                     Select-Object -First 1
            if (-not $qmake) { throw "qmake.exe not found" }
            $qtRoot = $qmake.Directory.Parent.FullName
          }
          Write-Host "QT_ROOT_DIR=$qtRoot"
          "QT_ROOT_DIR=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CMAKE_PREFIX_PATH=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PATH=$qtRoot\bin;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure CMake (Ninja)
        shell: cmd
        run: |
          echo QT_ROOT_DIR=%QT_ROOT_DIR%
          where cl
          where ninja
          cmake -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_PREFIX_PATH=%QT_ROOT_DIR% ^
            -DQT6_ROOT_DIR=%QT_ROOT_DIR%

      - name: Build Release
        shell: cmd
        run: cmake --build build --parallel

      - name: Deploy with windeployqt
        shell: cmd
        run: |
          set EXE=build\GoldPriceBarLite.exe
          if not exist "%EXE%" (
            echo try Release subdir
            set EXE=build\Release\GoldPriceBarLite.exe
          )
          if not exist "%EXE%" (
            dir /s /b build\*.exe
            exit /b 1
          )
          mkdir dist\GoldPriceBarLite
          copy /Y "%EXE%" dist\GoldPriceBarLite\
          "%QT_ROOT_DIR%\bin\windeployqt.exe" --release --no-translations --compiler-runtime dist\GoldPriceBarLite\GoldPriceBarLite.exe
          dir dist\GoldPriceBarLite

      - name: Zip package
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF_NAME } else { "main-$($env:GITHUB_SHA.Substring(0,7))" }
          Compress-Archive -Path dist\GoldPriceBarLite\* -DestinationPath "dist\GoldPriceBarLite-$ver-win64.zip" -Force
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/*-win64.zip
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [source-package, windows-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f -ls || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: GoldPriceBarLite ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            artifacts/source-zip/*.zip
            artifacts/windows-release/*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
