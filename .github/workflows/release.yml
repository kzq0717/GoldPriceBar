# 自动构建 + 打 tag(v*) 时发布 Release
# 修复：Qt 安装改用 aqtinstall + 更稳的版本/架构组合
name: Build and Package

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create source archive
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="main-$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          mkdir -p dist
          git archive --format=zip --prefix="GoldPriceBarLite-${VERSION}/" \
            -o "dist/GoldPriceBarLite-${VERSION}-src.zip" HEAD
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: source-zip
          path: dist/*.zip
          if-no-files-found: error

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (for aqtinstall)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Qt 6.5.3 via aqtinstall
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install aqtinstall
          # 使用长期可用的 6.5.3 + msvc2019 套件（与 VS2022 兼容）
          aqt install-qt windows desktop 6.5.3 win64_msvc2019_64 -m qtcharts -O "$env:GITHUB_WORKSPACE\Qt"
          Get-ChildItem "$env:GITHUB_WORKSPACE\Qt" -Recurse -Depth 3 | Select-Object -First 40 FullName
          $qtRoot = Get-ChildItem "$env:GITHUB_WORKSPACE\Qt\6.5.3" -Directory | Select-Object -First 1 -ExpandProperty FullName
          echo "QT_ROOT_DIR=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          echo "CMAKE_PREFIX_PATH=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "QT_ROOT_DIR=$qtRoot"

      - name: Configure CMake
        shell: cmd
        run: |
          echo QT_ROOT_DIR=%QT_ROOT_DIR%
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH=%QT_ROOT_DIR% -DQT6_ROOT_DIR=%QT_ROOT_DIR%

      - name: Build Release
        shell: cmd
        run: cmake --build build --config Release --parallel

      - name: Deploy with windeployqt
        shell: cmd
        run: |
          set EXE=build\Release\GoldPriceBarLite.exe
          if not exist %EXE% (
            echo EXE not found
            dir /s /b build\*.exe
            exit /b 1
          )
          mkdir dist\GoldPriceBarLite
          copy /Y %EXE% dist\GoldPriceBarLite\
          "%QT_ROOT_DIR%\bin\windeployqt.exe" --release --no-translations --compiler-runtime dist\GoldPriceBarLite\GoldPriceBarLite.exe
          dir dist\GoldPriceBarLite

      - name: Zip package
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF_NAME } else { "main-$($env:GITHUB_SHA.Substring(0,7))" }
          Compress-Archive -Path dist\GoldPriceBarLite\* -DestinationPath "dist\GoldPriceBarLite-$ver-win64.zip" -Force
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/*-win64.zip
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [source-package, windows-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f -ls || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: GoldPriceBarLite ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: |
            artifacts/source-zip/*.zip
            artifacts/windows-release/*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
