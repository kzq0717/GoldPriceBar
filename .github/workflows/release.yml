name: Build and Package

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- 源码包（每次推送）----------
  source-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create source archive
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            VERSION="main-$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          # 排除构建与 git
          git archive --format=zip --prefix=GoldPriceBarLite-/ -o "dist/GoldPriceBarLite-${VERSION}-src.zip" HEAD
          ls -lh dist/

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-zip
          path: dist/*.zip

  # ---------- Windows Release 编译打包 ----------
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.7
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Configure CMake
        shell: cmd
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH=%QT_ROOT_DIR% -DQT6_ROOT_DIR=%QT_ROOT_DIR%

      - name: Build Release
        shell: cmd
        run: |
          cmake --build build --config Release --parallel

      - name: Deploy Qt runtime (windeployqt)
        shell: cmd
        run: |
          set EXE=build\Release\GoldPriceBarLite.exe
          if not exist %EXE% (
            echo EXE not found
            dir /s /b build\*.exe
            exit /b 1
          )
          mkdir dist\GoldPriceBarLite
          copy /Y %EXE% dist\GoldPriceBarLite\
          %QT_ROOT_DIR%\bin\windeployqt.exe --release --no-translations dist\GoldPriceBarLite\GoldPriceBarLite.exe

      - name: Zip package
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF_NAME } else { "main-$($env:GITHUB_SHA.Substring(0,7))" }
          Compress-Archive -Path dist\GoldPriceBarLite\* -DestinationPath "dist\GoldPriceBarLite-$ver-win64.zip" -Force
          Get-ChildItem dist

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/*-win64.zip

  # ---------- 打 tag 时创建 GitHub Release ----------
  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [source-package, windows-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/source-zip/*.zip
            artifacts/windows-release/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
